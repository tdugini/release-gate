name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: releasegate_ci
          POSTGRES_USER: releasegate
          POSTGRES_PASSWORD: releasegate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releasegate -d releasegate_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__ReleaseGate: Host=localhost;Port=5432;Database=releasegate_ci;Username=releasegate;Password=releasegate_ci
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ReleaseGate.slnx

      - name: Build
        run: dotnet build ReleaseGate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ReleaseGate.slnx --configuration Release --no-build

      - name: Apply migrations to empty PostgreSQL database
        run: >-
          dotnet ef database update
          --project apps/api/ReleaseGate.Api
          --configuration Release
          --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  sdk-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-js
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
