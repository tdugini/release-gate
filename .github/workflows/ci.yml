name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: releasegate_ci
          POSTGRES_USER: releasegate
          POSTGRES_PASSWORD: releasegate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releasegate -d releasegate_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__ReleaseGate: Host=localhost;Port=5432;Database=releasegate_ci;Username=releasegate;Password=releasegate_ci
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ReleaseGate.slnx

      - name: Build
        run: dotnet build ReleaseGate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ReleaseGate.slnx --configuration Release --no-build

      - name: Verify migration snapshot is current
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project apps/api/ReleaseGate.Api
          --configuration Release
          --no-build

      - name: Apply migrations to empty PostgreSQL database
        run: >-
          dotnet ef database update
          --project apps/api/ReleaseGate.Api
          --configuration Release
          --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  sdk-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-js
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate package contents
        run: npm run pack:check

  public-demo:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: releasegate_demo_ci
          POSTGRES_USER: releasegate
          POSTGRES_PASSWORD: releasegate_demo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releasegate -d releasegate_demo_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate VPS compose configuration
        env:
          POSTGRES_PASSWORD: releasegate_demo_ci
          RELEASEGATE_HOST: releasegate.test
        run: docker compose config > /dev/null

      - name: Build public demo image
        run: >-
          docker build
          -f Dockerfile
          --build-arg VITE_DEMO_ACCESS_TOKEN=releasegate-demo-viewer
          -t releasegate-public-demo
          .

      - name: Start public demo image
        run: >-
          docker run -d
          --name releasegate-public-demo
          --network host
          -e ASPNETCORE_HTTP_PORTS=8090
          -e DemoMode__Enabled=true
          -e ControlPlaneAuth__Tokens__0__Token=releasegate-demo-viewer
          -e ControlPlaneAuth__Tokens__0__Subject=portfolio-demo
          -e 'ControlPlaneAuth__Tokens__0__DisplayName=Portfolio Demo'
          -e 'ConnectionStrings__ReleaseGate=Host=127.0.0.1;Port=5432;Database=releasegate_demo_ci;Username=releasegate;Password=releasegate_demo_ci'
          releasegate-public-demo

      - name: Wait for public demo
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8090/health > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker logs releasegate-public-demo
          exit 1

      - name: Smoke test public demo
        run: |
          curl -fsS http://localhost:8090/ | grep -q 'ReleaseGate'

          identity="$(curl -fsS \
            -H 'Authorization: Bearer releasegate-demo-viewer' \
            http://localhost:8090/api/auth/me)"

          echo "$identity" | grep -q '"subject":"portfolio-demo"'
          echo "$identity" | grep -q '"roles":\[\]'

          projects="$(curl -fsS \
            -H 'Authorization: Bearer releasegate-demo-viewer' \
            http://localhost:8090/api/projects)"

          echo "$projects" | grep -q 'silva-commerce'

          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'Authorization: Bearer releasegate-demo-viewer' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Should fail","key":"should-fail","description":null}' \
            http://localhost:8090/api/projects)"

          test "$status" = "403"

      - name: Show public demo logs on failure
        if: failure()
        run: docker logs releasegate-public-demo

      - name: Stop public demo image
        if: always()
        run: docker rm -f releasegate-public-demo || true

  deployment:
    runs-on: ubuntu-latest
    needs: [api, web, sdk-js]
    env:
      POSTGRES_PASSWORD: releasegate-ci-database
      CONTROL_PLANE_OPERATOR_TOKEN: releasegate-ci-operator
      CONTROL_PLANE_REVIEWER_TOKEN: releasegate-ci-reviewer
      RUNTIME_API_KEY: releasegate-ci-runtime
      WEB_PORT: 8080
    steps:
      - uses: actions/checkout@v5

      - name: Start production-like stack
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for ReleaseGate
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker compose -f docker-compose.prod.yml logs
          exit 1

      - name: Smoke test deployed control plane and runtime
        run: |
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $CONTROL_PLANE_OPERATOR_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"CI deployment","key":"ci-deployment","description":"Production stack smoke test"}' \
            http://localhost:8080/api/projects > /dev/null

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $CONTROL_PLANE_OPERATOR_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"Deployment flag","key":"deployment-flag","description":null}' \
            http://localhost:8080/api/projects/ci-deployment/flags > /dev/null

          curl -fsS \
            -X PATCH \
            -H "Authorization: Bearer $CONTROL_PLANE_OPERATOR_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true,"rolloutPercentage":100}' \
            http://localhost:8080/api/projects/ci-deployment/flags/deployment-flag/environments/development > /dev/null

          snapshot="$(curl -fsS \
            -H "X-ReleaseGate-Key: $RUNTIME_API_KEY" \
            'http://localhost:8080/api/runtime/projects/ci-deployment/environments/development/snapshot?subjectKey=ci-user')"

          echo "$snapshot" | grep -q '"key":"deployment-flag","enabled":true'

          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            'http://localhost:8080/api/runtime/projects/ci-deployment/environments/development/snapshot?subjectKey=ci-user')"
          test "$status" = "401"

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Stop production-like stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
