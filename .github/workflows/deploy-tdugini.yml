name: Deploy to TDUGINI VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tdugini
  cancel-in-progress: true

jobs:
  copy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse SERVER secret
        id: server
        run: |
          SERVER="${{ secrets.SERVER }}"
          echo "user=${SERVER%@*}" >> "$GITHUB_OUTPUT"
          echo "host=${SERVER#*@}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH (agent + key + passphrase)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/.tmp
          mv ~/.ssh/.tmp ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "==> Local private key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key

          # Validate the passphrase first, so we know it is right
          # before trying to wire it into the agent. ssh-keygen -y
          # reads the passphrase with -P, prints the public key on
          # success or fails on mismatch.
          echo "==> Validate passphrase against the key:"
          PUBKEY_OUT=$(ssh-keygen -y -f ~/.ssh/deploy_key -P "$SSH_PASSPHRASE" 2>&1)
          if echo "$PUBKEY_OUT" | grep -qE '^(ssh|ecdsa)-'; then
            echo "Passphrase is correct, public key extracted."
            echo "Public key: $(echo "$PUBKEY_OUT" | head -n1)"
          else
            echo "::error::Passphrase did NOT unlock the key. Output was:"
            echo "$PUBKEY_OUT"
            exit 1
          fi

          # askpass script. Use single-quoted heredoc is unsafe inside
          # YAML block scalars, so we emit it with printf.
          printf '#!/bin/sh\necho "$SSH_PASSPHRASE"\n' > ~/.ssh/_askpass.sh
          chmod 700 ~/.ssh/_askpass.sh
          echo "==> askpass script written, $(wc -c < ~/.ssh/_askpass.sh) bytes"

          eval "$(ssh-agent -s)"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          # Run ssh-add. Capture exit code, do not let it kill the
          # step before we get to print the verbose output. Disable
          # 'set -e' just for this call.
          echo "==> ssh-add (verbose):"
          set +e
          SSH_ASKPASS="$HOME/.ssh/_askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
            ssh-add -v ~/.ssh/deploy_key
          ADD_EXIT=$?
          set -e
          echo "ssh-add exit code: $ADD_EXIT"
          if [ "$ADD_EXIT" -ne 0 ]; then
            echo "::error::ssh-add failed with exit $ADD_EXIT"
            exit 1
          fi

          echo "==> Agent loaded keys:"
          ssh-add -l

          # Smoke test the connection. BatchMode=yes makes ssh fail
          # immediately if the agent does not have a usable key.
          # We deliberately do NOT set IdentitiesOnly=yes here:
          # that option tells ssh to ignore the agent and only use
          # -i / config identities, which we don't have.
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          echo "==> Test SSH connection to ${USER}@${HOST}:"
          set +e
          ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${USER}@${HOST}" \
              "echo 'SSH OK' && hostname && id" 2>&1
          SSH_EXIT=$?
          set -e
          echo "ssh exit code: $SSH_EXIT"
          if [ "$SSH_EXIT" -ne 0 ]; then
            echo "::error::SSH connection test failed."
            exit 1
          fi
        env:
          SSH_KEY: ${{ secrets.KEY }}
          SSH_PASSPHRASE: ${{ secrets.PASS_KEY }}

      - name: SCP project to VPS
        run: |
          set -euo pipefail
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Recreating ${DEST} on ${USER}@${HOST}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" "rm -rf '${DEST}' && mkdir -p '${DEST}'"
          echo "==> scp -r ./ ${USER}@${HOST}:${DEST}/"
          scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ./ "${USER}@${HOST}:${DEST}/"
          echo "==> scp finished"

      - name: Verify remote directory
        if: always()
        run: |
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Listing ${DEST} on ${USER}@${HOST}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "echo '--- ls -la ---' && ls -la '${DEST}' && echo '--- head -3 docker-compose.yml ---' && head -3 '${DEST}/docker-compose.yml' 2>&1 || echo 'docker-compose.yml missing'"

      - name: Resolve the Postgres password
        id: dbpw
        env:
          POSTGRES_PASSWORD: ${{ secrets.RELEASEGATE_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          # The database password must be stable across deploys. Generating
          # one here would silently fork the app credentials from the role
          # password already stored in the Postgres volume.
          if [ -z "${POSTGRES_PASSWORD:-}" ]; then
            echo "::error::Secret RELEASEGATE_POSTGRES_PASSWORD is empty. Set it in the repository secrets."
            exit 1
          fi
          echo "POSTGRES_PASSWORD is set (${#POSTGRES_PASSWORD} chars, value not shown)"
          # Ship it base64-encoded so no quoting or shell-expansion surprise
          # happens when it crosses the ssh boundary.
          echo "b64=$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Start containers on VPS
        run: |
          set -euo pipefail
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          COMPOSE_FILE="docker-compose.yml"
          PG_PW_B64="${{ steps.dbpw.outputs.b64 }}"

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "set -euo pipefail
             cd '${DEST}'
             PG_PW=\$(printf '%s' '${PG_PW_B64}' | base64 -d)

             # .env is rewritten on every deploy from the secret above, so it
             # no longer depends on surviving the 'rm -rf' in the copy step.
             umask 077
             printf 'POSTGRES_DB=releasegate\nPOSTGRES_USER=releasegate\nPOSTGRES_PASSWORD=%s\nDEMO_ACCESS_TOKEN=releasegate-demo-viewer\n' \"\$PG_PW\" > .env
             chmod 600 .env
             echo '--- .env keys ---'
             sed -E 's/=.*/=<redacted>/' .env

             if [ ! -f '${COMPOSE_FILE}' ]; then
               echo '::error::${COMPOSE_FILE} not found in ${DEST}'
               exit 1
             fi
             if ! docker network inspect docker_frontend_wp >/dev/null 2>&1; then
               echo '::error::External network docker_frontend_wp is missing on the host'
               exit 1
             fi

             docker compose -f '${COMPOSE_FILE}' up -d --build --remove-orphans
             echo '==> Active containers:'
             docker compose -f '${COMPOSE_FILE}' ps

             # Postgres only applies POSTGRES_PASSWORD while it initialises an
             # empty PGDATA. Against a pre-existing volume the role keeps its
             # original password, so the api would get 28P01 on every start.
             # Align the role with .env explicitly: idempotent, data preserved.
             echo '==> Aligning the releasegate role password with .env'
             PW_SQL=\$(printf \"%s\" \"\$PG_PW\" | sed \"s/'/''/g\")
             docker compose -f '${COMPOSE_FILE}' exec -T postgres \
               psql -v ON_ERROR_STOP=1 -U releasegate -d releasegate \
               -c \"ALTER ROLE releasegate WITH PASSWORD '\$PW_SQL';\""

          echo "==> Verifying the api is actually serving (not crash-looping)"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "set -euo pipefail
             cd '${DEST}'
             API=\$(docker compose -f '${COMPOSE_FILE}' ps -q app)
             if [ -z \"\$API\" ]; then
               echo '::error::No app container was created'
               exit 1
             fi
             for i in \$(seq 1 30); do
               STATUS=\$(docker inspect -f '{{.State.Status}}' \"\$API\")
               if [ \"\$STATUS\" = 'running' ]; then break; fi
               sleep 4
             done
             STATUS=\$(docker inspect -f '{{.State.Status}}' \"\$API\")
             echo \"==> app status: \$STATUS (restarts: \$(docker inspect -f '{{.RestartCount}}' \"\$API\"))\"
             if [ \"\$STATUS\" != 'running' ]; then
               echo \"::error::The api container is '\$STATUS' instead of running. Last 40 log lines:\"
               docker logs --tail 40 \"\$API\" || true
               exit 1
             fi"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### ReleaseGate deployed to TDUGINI VPS"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Compose project: \`releasegate\` (\`docker-compose.yml\`)"
            echo "- Database role password re-aligned with the \`RELEASEGATE_POSTGRES_PASSWORD\` secret"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify directory contents after deploy
        if: always()
        run: |
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Listing ${DEST} AFTER deploy"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "echo '--- ls -la after deploy ---' && ls -la '${DEST}' && echo '---' && ls '${DEST}' | wc -l"

      - name: Stop SSH agent
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" 2>/dev/null || true
          fi
