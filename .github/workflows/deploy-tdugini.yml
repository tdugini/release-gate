name: Deploy to TDUGINI VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tdugini
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse SERVER secret
        id: server
        run: |
          SERVER="${{ secrets.SERVER }}"
          echo "user=${SERVER%@*}" >> "$GITHUB_OUTPUT"
          echo "host=${SERVER#*@}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH (agent + key + passphrase)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/deploy_key.tmp
          mv ~/.ssh/deploy_key.tmp ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/_askpass.sh <<'OUTER'
#!/bin/sh
echo "$SSH_PASSPHRASE"
OUTER
          chmod 700 ~/.ssh/_askpass.sh

          eval "$(ssh-agent -s)"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          SSH_ASKPASS=$HOME/.ssh/_askpass.sh \
          SSH_ASKPASS_REQUIRE=force \
          setsid ssh-add ~/.ssh/deploy_key

          echo "==> Loaded keys:"
          ssh-add -l
        env:
          SSH_KEY: ${{ secrets.KEY }}
          SSH_PASSPHRASE: ${{ secrets.PASSWORD_KEY }}

      - name: Reset remote project directory
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }}" \
            "rm -rf /docker/TDUGINI/releasegate && mkdir -p /docker/TDUGINI/releasegate"

      - name: SCP project to VPS
        run: |
          scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ./ "${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }}:/docker/TDUGINI/releasegate/"

      - name: Start containers on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }}" \
            "cd /docker/TDUGINI/releasegate && docker compose up -d --build --remove-orphans && docker compose ps"
