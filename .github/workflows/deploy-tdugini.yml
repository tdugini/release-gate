name: Deploy to TDUGINI VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tdugini
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse SERVER secret into user and host
        id: server
        run: |
          SERVER="${{ secrets.SERVER }}"
          if [[ "$SERVER" != *"@"* ]]; then
            echo "::error::SERVER secret must be in the form user@host (got: $SERVER)"
            exit 1
          fi
          echo "user=${SERVER%@*}" >> "$GITHUB_OUTPUT"
          echo "host=${SERVER#*@}" >> "$GITHUB_OUTPUT"
          echo "Parsed SSH target: ${SERVER%@*}@${SERVER#*@}"

      - name: Install rsync
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
          rsync --version | head -n 1

      - name: Write SSH key to disk
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          # Write the key. Use 'printf %s\n' to keep the value verbatim
          # and ensure a trailing newline (ssh requires it).
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key

          # Normalize line endings: some paste/upload paths introduce
          # CRLF, which breaks ssh-keygen and ssh. tr -d '\r' is a no-op
          # for already-LF keys.
          tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/deploy_key.tmp
          mv ~/.ssh/deploy_key.tmp ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          bytes=$(wc -c < ~/.ssh/deploy_key | tr -d ' ')
          lines=$(wc -l < ~/.ssh/deploy_key | tr -d ' ')
          first_line=$(head -n 1 ~/.ssh/deploy_key)
          last_line=$(tail -n 1 ~/.ssh/deploy_key)
          fingerprint=$(sha256sum ~/.ssh/deploy_key | awk '{print $1}')

          echo "==> SSH key on disk: $bytes bytes, $lines lines"
          echo "==> First line: $first_line"
          echo "==> Last line:  $last_line"
          echo "==> SHA256:      $fingerprint"

          # Validate the key. We only warn — the actual ssh/rsync call
          # will give a clearer, actionable error if the key is wrong.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::warning::ssh-keygen could not parse the deployed key."
            echo "::warning::Check the KEY secret: it must be a valid OpenSSH or PEM private key, in one piece."
          fi
        env:
          SSH_KEY: ${{ secrets.KEY }}

      - name: Sync project to VPS via rsync over SSH
        run: |
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Syncing to ${USER}@${HOST}:${DEST}"

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${USER}@${HOST}" "mkdir -p '${DEST}'"

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.vs/' \
            --exclude='.idea/' \
            --exclude='**/bin/' \
            --exclude='**/obj/' \
            --exclude='**/bin' \
            --exclude='**/obj' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ "${USER}@${HOST}:${DEST}/"

          echo "==> rsync finished"

      - name: Start containers on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.server.outputs.host }}
          username: ${{ steps.server.outputs.user }}
          key: ${{ secrets.KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            DEPLOY_DIR="/docker/TDUGINI/releasegate"
            COMPOSE_FILE="docker-compose.yml"

            echo "==> Target directory: ${DEPLOY_DIR}"

            if [ ! -d "${DEPLOY_DIR}" ]; then
              echo "::error::Deploy directory ${DEPLOY_DIR} does not exist after sync"
              exit 1
            fi

            cd "${DEPLOY_DIR}"

            if [ ! -f "${COMPOSE_FILE}" ]; then
              echo "::error::${COMPOSE_FILE} not found in ${DEPLOY_DIR}"
              exit 1
            fi

            # ReleaseGate expects the shared external Traefik network
            # to already exist on the host.
            if ! docker network inspect docker_frontend_wp >/dev/null 2>&1; then
              echo "::error::External network 'docker_frontend_wp' is missing on the host."
              echo "::error::ReleaseGate requires the shared Traefik network; aborting."
              exit 1
            fi

            echo "==> Building and starting containers"
            docker compose -f "${COMPOSE_FILE}" up -d --build --remove-orphans

            echo "==> Active containers"
            docker compose -f "${COMPOSE_FILE}" ps

            echo "==> Deploy finished"
