name: Deploy to TDUGINI VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tdugini
  cancel-in-progress: true

jobs:
  copy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse SERVER secret
        id: server
        run: |
          SERVER="${{ secrets.SERVER }}"
          echo "user=${SERVER%@*}" >> "$GITHUB_OUTPUT"
          echo "host=${SERVER#*@}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH (agent + key + passphrase)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/.tmp
          mv ~/.ssh/.tmp ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "==> Local private key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key

          # Validate the passphrase first, so we know it is right
          # before trying to wire it into the agent. ssh-keygen -y
          # reads the passphrase with -P, prints the public key on
          # success or fails on mismatch.
          echo "==> Validate passphrase against the key:"
          PUBKEY_OUT=$(ssh-keygen -y -f ~/.ssh/deploy_key -P "$SSH_PASSPHRASE" 2>&1)
          if echo "$PUBKEY_OUT" | grep -qE '^(ssh|ecdsa)-'; then
            echo "Passphrase is correct, public key extracted."
            echo "Public key: $(echo "$PUBKEY_OUT" | head -n1)"
          else
            echo "::error::Passphrase did NOT unlock the key. Output was:"
            echo "$PUBKEY_OUT"
            exit 1
          fi

          # askpass script. Use single-quoted heredoc is unsafe inside
          # YAML block scalars, so we emit it with printf.
          printf '#!/bin/sh\necho "$SSH_PASSPHRASE"\n' > ~/.ssh/_askpass.sh
          chmod 700 ~/.ssh/_askpass.sh
          echo "==> askpass script written, $(wc -c < ~/.ssh/_askpass.sh) bytes"

          eval "$(ssh-agent -s)"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          # Run ssh-add. Capture exit code, do not let it kill the
          # step before we get to print the verbose output. Disable
          # 'set -e' just for this call.
          echo "==> ssh-add (verbose):"
          set +e
          SSH_ASKPASS="$HOME/.ssh/_askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
            ssh-add -v ~/.ssh/deploy_key
          ADD_EXIT=$?
          set -e
          echo "ssh-add exit code: $ADD_EXIT"
          if [ "$ADD_EXIT" -ne 0 ]; then
            echo "::error::ssh-add failed with exit $ADD_EXIT"
            exit 1
          fi

          echo "==> Agent loaded keys:"
          ssh-add -l

          # Smoke test the connection. BatchMode=yes makes ssh fail
          # immediately if the agent does not have a usable key.
          # We deliberately do NOT set IdentitiesOnly=yes here:
          # that option tells ssh to ignore the agent and only use
          # -i / config identities, which we don't have.
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          echo "==> Test SSH connection to ${USER}@${HOST}:"
          set +e
          ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${USER}@${HOST}" \
              "echo 'SSH OK' && hostname && id" 2>&1
          SSH_EXIT=$?
          set -e
          echo "ssh exit code: $SSH_EXIT"
          if [ "$SSH_EXIT" -ne 0 ]; then
            echo "::error::SSH connection test failed."
            exit 1
          fi
        env:
          SSH_KEY: ${{ secrets.KEY }}
          SSH_PASSPHRASE: ${{ secrets.PASS_KEY }}

      - name: SCP project to VPS
        run: |
          set -euo pipefail
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Recreating ${DEST} on ${USER}@${HOST}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" "rm -rf '${DEST}' && mkdir -p '${DEST}'"
          echo "==> scp -r ./ ${USER}@${HOST}:${DEST}/"
          scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ./ "${USER}@${HOST}:${DEST}/"
          echo "==> scp finished"

      - name: Verify remote directory
        if: always()
        run: |
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Listing ${DEST} on ${USER}@${HOST}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "echo '--- ls -la ---' && ls -la '${DEST}' && echo '--- head -3 docker-compose.yml ---' && head -3 '${DEST}/docker-compose.yml' 2>&1 || echo 'docker-compose.yml missing'"

      - name: Start containers on VPS
        run: |
          set -euo pipefail
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          COMPOSE_FILE="docker-compose.yml"

          # Ensure a .env file exists on the VPS so docker compose
          # can expand POSTGRES_PASSWORD and friends. Only generated
          # the first time; on later deploys the existing file is
          # kept so the Postgres volume remains accessible.
          PG_PW="$${POSTGRES_PASSWORD:-}"
          if [ -z "$PG_PW" ]; then
            PG_PW=$(openssl rand -base64 24 | tr -d '=+/' | cut -c1-24)
            echo "==> POSTGRES_PASSWORD not provided, generated a random one"
          else
            echo "==> POSTGRES_PASSWORD provided via env"
          fi

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "set -e
             cd '${DEST}'
             if [ ! -f .env ]; then
               printf 'POSTGRES_PASSWORD=%s\nDEMO_ACCESS_TOKEN=releasegate-demo-viewer\n' '${PG_PW}' > .env
               chmod 600 .env
               echo '==> .env created'
             else
               echo '==> .env already present, keeping existing POSTGRES_PASSWORD'
             fi
             echo '--- .env keys ---'
             sed -E 's/=.*/=<redacted>/' .env"

          echo "==> cd ${DEST} && docker compose up -d --build --remove-orphans"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "set -euo pipefail
             cd '${DEST}'
             if [ ! -f '${COMPOSE_FILE}' ]; then
               echo '::error::${COMPOSE_FILE} not found in ${DEST}'
               exit 1
             fi
             if ! docker network inspect docker_frontend_wp >/dev/null 2>&1; then
               echo '::error::External network docker_frontend_wp is missing on the host'
               exit 1
             fi
             docker compose -f '${COMPOSE_FILE}' up -d --build --remove-orphans
             echo '==> Active containers:'
             docker compose -f '${COMPOSE_FILE}' ps"

      - name: Verify directory contents after deploy
        if: always()
        run: |
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Listing ${DEST} AFTER deploy"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "echo '--- ls -la after deploy ---' && ls -la '${DEST}' && echo '---' && ls '${DEST}' | wc -l"

      - name: Stop SSH agent
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" 2>/dev/null || true
          fi
