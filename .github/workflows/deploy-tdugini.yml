name: Deploy to TDUGINI VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tdugini
  cancel-in-progress: true

jobs:
  copy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse SERVER secret
        id: server
        run: |
          SERVER="${{ secrets.SERVER }}"
          echo "user=${SERVER%@*}" >> "$GITHUB_OUTPUT"
          echo "host=${SERVER#*@}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH (agent + key + passphrase)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/.tmp
          mv ~/.ssh/.tmp ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Show the local key fingerprint so we can compare with the
          # authorized key on the host.
          echo "==> Local private key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key

          # askpass script: prints the passphrase to ssh-add
          printf '#!/bin/sh\necho "$SSH_PASSPHRASE"\n' > ~/.ssh/_askpass.sh
          chmod 700 ~/.ssh/_askpass.sh

          eval "$(ssh-agent -s)"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          SSH_ASKPASS=$HOME/.ssh/_askpass.sh SSH_ASKPASS_REQUIRE=force setsid ssh-add ~/.ssh/deploy_key

          echo "==> Agent loaded keys:"
          ssh-add -l

          # Smoke test the connection. BatchMode=yes makes ssh fail
          # immediately if the agent does not have a usable key —
          # exactly the diagnostic we need.
          echo "==> Test SSH connection to host:"
          if ssh -o BatchMode=yes \
                 -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null \
                 -o IdentitiesOnly=yes \
                 "${USER_HOST:-tdugini@cloud.leonardoforconi.com}" \
                 "echo 'SSH OK' && hostname && id" 2>&1; then
            echo "==> SSH connection test passed"
          else
            echo "::error::SSH connection test failed. The agent does not have a key that the host accepts."
            echo "::error::Check that the public key of the private key in the KEY secret is in"
            echo "::error::~/.ssh/authorized_keys of the SSH user on the host."
            exit 1
          fi
        env:
          SSH_KEY: ${{ secrets.KEY }}
          SSH_PASSPHRASE: ${{ secrets.PASSWORD_KEY }}
          USER_HOST: ${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }}

      - name: Read authorized keys on host for comparison
        if: always()
        run: |
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          echo "==> Reading ~/.ssh/authorized_keys on ${USER}@${HOST}"
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes \
              "${USER}@${HOST}" \
              "if [ -f ~/.ssh/authorized_keys ]; then \
                 echo '--- authorized_keys fingerprints ---'; \
                 ssh-keygen -l -f ~/.ssh/authorized_keys; \
               else \
                 echo 'no ~/.ssh/authorized_keys on host'; \
               fi" 2>&1 || echo "could not read authorized_keys (auth failed)"

      - name: SCP project to VPS
        run: |
          set -euo pipefail
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Recreating ${DEST} on ${USER}@${HOST}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" "rm -rf '${DEST}' && mkdir -p '${DEST}'"
          echo "==> scp -r ./ ${USER}@${HOST}:${DEST}/"
          scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ./ "${USER}@${HOST}:${DEST}/"
          echo "==> scp finished"

      - name: Verify remote directory
        if: always()
        run: |
          USER="${{ steps.server.outputs.user }}"
          HOST="${{ steps.server.outputs.host }}"
          DEST="/docker/TDUGINI/releasegate"
          echo "==> Listing ${DEST} on ${USER}@${HOST}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${HOST}" \
            "echo '--- ls -la ---' && ls -la '${DEST}' && echo '--- head -3 docker-compose.yml ---' && head -3 '${DEST}/docker-compose.yml' 2>&1 || echo 'docker-compose.yml missing'"

      - name: Stop SSH agent
        if: always()
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" 2>/dev/null || true
          fi
