name: Generate web lockfile

on:
  push:
    branches:
      - feature/v0.1-core-flags
    paths:
      - '.github/workflows/generate-web-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/v0.1-core-flags

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate package lock
        working-directory: apps/web
        run: npm install --package-lock-only

      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "chore: add reproducible web lockfile"
          git push origin HEAD:feature/v0.1-core-flags
