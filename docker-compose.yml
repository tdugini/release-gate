services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releasegate}
      POSTGRES_USER: ${POSTGRES_USER:-releasegate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-releasegate_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - releasegate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-releasegate} -d ${POSTGRES_DB:-releasegate}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  releasegate-postgres:
